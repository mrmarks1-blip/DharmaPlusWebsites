<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dharma Practice">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6b0f1a">
<link rel="manifest" href="manifest.json">
<title>Dharma Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS — the whole look is driven from here.
   Shared tokens (type, radii, layout) first; colour themes below.
   Components further down only ever read these variables.
═══════════════════════════════════════════════════════════════ */
:root {
  /* Type families */
  --f-display:'Playfair Display',Georgia,serif;   /* headings, labels */
  --f-serif:'Cormorant Garamond',Georgia,serif;   /* reading text, accents */
  --f-ui:'Lato',system-ui,sans-serif;             /* controls, meta */
  /* Type scale — multiplied by --scale (Settings → Text size) */
  --scale:1;
  --fs-label:calc(9px * var(--scale));    /* SMALL CAPS section labels */
  --fs-meta:calc(10px * var(--scale));    /* secondary lines, captions */
  --fs-small:calc(11px * var(--scale));
  --fs-ui:calc(12px * var(--scale));      /* buttons, links, chips */
  --fs-body:calc(13px * var(--scale));
  --fs-text:calc(14px * var(--scale));    /* default body */
  --fs-title:calc(15px * var(--scale));   /* card & list titles */
  --fs-read:calc(16px * var(--scale));    /* serif reading text */
  --fs-read-lg:calc(17px * var(--scale));
  --fs-h:calc(18px * var(--scale));
  --fs-h1:calc(22px * var(--scale));
  /* Shape */
  --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-2xl:20px;
  /* Layout */
  --gutter:14px; --col-w:760px; --nav-w:170px;
  --nav-h:62px; --safe-b:env(safe-area-inset-bottom,0px);
  /* Status & fixed accents (same in every theme) */
  --ok:#50a060; --bad:#c05038; --done:#2e7d46; --spark:#f0b830; --grid:#9b1c2a;
}

/* Colour themes. "light" also lives on :root so it is the default.
   Any element with data-theme="…" gets that theme's colours for its
   subtree — Settings uses this to preview each theme on its own card. */
:root, [data-theme="light"] {
  --bg:#fdf8f0; --surf:#f0e8d8; --card:#fff; --card2:#f5ede0;
  --bdr:rgba(107,15,26,.15); --bdr-hi:rgba(107,15,26,.4);
  --gold:#7a4e00; --gold-hi:#a06800; --gold-lo:rgba(122,78,0,.45); --gold-ghost:rgba(122,78,0,.07);
  --red:#6b0f1a; --red-hi:#8b2020; --red-lo:rgba(107,15,26,.07);
  --tx:#1a0804; --tx-mid:#5a3820; --tx-lo:#8a6850; --tx-ghost:#c0a890;
  --nav-bg:linear-gradient(180deg,#fff,#f5ede0); --nav-bdr:rgba(107,15,26,.12);
  --modal:rgba(0,0,0,.55); --inp:rgba(0,0,0,.04);
  --btn-bg:linear-gradient(135deg,#c8900a,#7a5808); --btn-tx:#f8f0d8;
}
[data-theme="dark"] {
  --bg:#0e0804; --surf:#180e06; --card:#221408; --card2:#2c1a0a;
  --bdr:rgba(210,155,40,.18); --bdr-hi:rgba(210,155,40,.45);
  --gold:#d4980a; --gold-hi:#f0b830; --gold-lo:rgba(212,152,10,.45); --gold-ghost:rgba(212,152,10,.07);
  --red:#8a3820; --red-hi:#c05030; --red-lo:rgba(138,56,32,.12);
  --tx:#f0e4c8; --tx-mid:#b09060; --tx-lo:#705838; --tx-ghost:#3a2814;
  --nav-bg:linear-gradient(180deg,#1a1006,#0e0804); --nav-bdr:rgba(210,155,40,.12);
  --modal:rgba(0,0,0,.82); --inp:rgba(255,255,255,.04);
}
[data-theme="neuro"] {
  --bg:#08101c; --surf:#101828; --card:#182030; --card2:#1e2838;
  --bdr:rgba(80,140,200,.2); --bdr-hi:rgba(80,140,200,.5);
  --gold:#5898c8; --gold-hi:#78b8e8; --gold-lo:rgba(88,152,200,.5); --gold-ghost:rgba(88,152,200,.07);
  --red:#2a5878; --red-hi:#3878b0; --red-lo:rgba(42,88,120,.1);
  --tx:#e0eaf8; --tx-mid:#80a0c0; --tx-lo:#406080; --tx-ghost:#182840;
  --nav-bg:linear-gradient(180deg,#101828,#08101c); --nav-bdr:rgba(80,140,200,.12);
  --modal:rgba(0,0,0,.85); --inp:rgba(255,255,255,.05);
  --btn-bg:linear-gradient(135deg,#2860a0,#14305a); --btn-tx:#e0f0ff;
}
[data-theme="temple"] {
  --bg:#1a0608; --surf:#220a0c; --card:#2c0e10; --card2:#340f12;
  --bdr:rgba(200,120,20,.2); --bdr-hi:rgba(200,120,20,.5);
  --gold:#e09020; --gold-hi:#f0b030; --gold-lo:rgba(220,140,20,.5); --gold-ghost:rgba(220,140,20,.08);
  --red:#d0560a; --red-hi:#e87020; --red-lo:rgba(200,80,10,.1);
  --tx:#f5e8d0; --tx-mid:#c09060; --tx-lo:#705030; --tx-ghost:#3a1a10;
  --nav-bg:linear-gradient(180deg,#2c0e10,#1a0608); --nav-bdr:rgba(200,120,20,.15);
  --modal:rgba(0,0,0,.85); --inp:rgba(255,255,255,.05);
}
[data-theme="night"] {
  --bg:#080c1e; --surf:#0e1430; --card:#141c3a; --card2:#1a2244;
  --bdr:rgba(160,130,200,.2); --bdr-hi:rgba(160,130,200,.5);
  --gold:#c0a060; --gold-hi:#d8bc80; --gold-lo:rgba(190,160,80,.5); --gold-ghost:rgba(190,160,80,.07);
  --red:#8050b8; --red-hi:#a070d8; --red-lo:rgba(120,70,180,.1);
  --tx:#f0e8ff; --tx-mid:#9080c0; --tx-lo:#504080; --tx-ghost:#201830;
  --nav-bg:linear-gradient(180deg,#141c3a,#080c1e); --nav-bdr:rgba(160,130,200,.12);
  --modal:rgba(0,0,0,.88); --inp:rgba(255,255,255,.05);
}
[data-theme="earth"] {
  --bg:#f5ede0; --surf:#ede0ce; --card:#fff8f0; --card2:#f8eed8;
  --bdr:rgba(160,80,20,.15); --bdr-hi:rgba(160,80,20,.4);
  --gold:#a06820; --gold-hi:#c08830; --gold-lo:rgba(160,100,20,.45); --gold-ghost:rgba(160,100,20,.07);
  --red:#b8490a; --red-hi:#d05818; --red-lo:rgba(180,70,10,.07);
  --tx:#2c1008; --tx-mid:#6a3818; --tx-lo:#9a6040; --tx-ghost:#d0b090;
  --nav-bg:linear-gradient(180deg,#fff8f0,#ede0ce); --nav-bdr:rgba(160,80,20,.12);
  --modal:rgba(0,0,0,.55); --inp:rgba(0,0,0,.04);
}
[data-theme="slate"] {
  --bg:#1c2330; --surf:#222c3c; --card:#283444; --card2:#2e3c4e;
  --bdr:rgba(140,170,200,.2); --bdr-hi:rgba(140,170,200,.45);
  --gold:#7090b0; --gold-hi:#90b0d0; --gold-lo:rgba(110,150,190,.5); --gold-ghost:rgba(110,150,190,.07);
  --red:#506080; --red-hi:#6080a0; --red-lo:rgba(70,90,120,.1);
  --tx:#d8e8f8; --tx-mid:#8090a8; --tx-lo:#506070; --tx-ghost:#283040;
  --nav-bg:linear-gradient(180deg,#283444,#1c2330); --nav-bdr:rgba(140,170,200,.12);
  --modal:rgba(0,0,0,.8); --inp:rgba(255,255,255,.04);
}
[data-theme="highc"] {
  --bg:#000000; --surf:#0a0a0a; --card:#050505; --card2:#141414;
  --bdr:rgba(255,255,255,.5); --bdr-hi:rgba(255,255,255,.8);
  --gold:#ffd400; --gold-hi:#ffe250; --gold-lo:rgba(255,212,0,.5); --gold-ghost:rgba(255,212,0,.12);
  --red:#ff8a3d; --red-hi:#ffa860; --red-lo:rgba(255,138,61,.16);
  --tx:#ffffff; --tx-mid:#ededed; --tx-lo:#cfcfcf; --tx-ghost:#8a8a8a;
  --nav-bg:linear-gradient(180deg,#0a0a0a,#000000); --nav-bdr:rgba(255,255,255,.4);
  --modal:rgba(0,0,0,.9); --inp:rgba(255,255,255,.08);
}
[data-theme="neon"] {
  --bg:#05060a; --surf:#0b0f18; --card:#0e1220; --card2:#141a2c;
  --bdr:rgba(22,224,208,.4); --bdr-hi:rgba(22,224,208,.7);
  --gold:#19e6d2; --gold-hi:#5cf0e0; --gold-lo:rgba(25,230,210,.5); --gold-ghost:rgba(25,230,210,.1);
  --red:#ff4be6; --red-hi:#ff78ee; --red-lo:rgba(255,75,230,.14);
  --tx:#eafcff; --tx-mid:#7fe6ff; --tx-lo:#79c8e0; --tx-ghost:#3a5a68;
  --nav-bg:linear-gradient(180deg,#0e1220,#05060a); --nav-bdr:rgba(22,224,208,.18);
  --modal:rgba(0,0,0,.88); --inp:rgba(255,255,255,.05);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
/* touch-action:manipulation stops double-tap zoom (fast tapping) but keeps pinch-zoom */
html,body { height:100%; overflow:hidden; background:var(--bg); touch-action:manipulation; }
body { font-family:var(--f-ui); color:var(--tx); font-size:var(--fs-text); }
a { color:inherit; }
button { font:inherit; color:inherit; }
::-webkit-scrollbar { width:2px; } ::-webkit-scrollbar-thumb { background:var(--gold-lo); border-radius:1px; }

/* ═══════════════════════════════════════════
   APP SHELL & NAV
═══════════════════════════════════════════ */
#app { position:fixed; inset:0; display:flex; flex-direction:column; }
#content { flex:1; overflow:hidden; position:relative; }
#nav {
  flex-shrink:0; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b);
  background:var(--nav-bg); border-top:1px solid var(--nav-bdr);
  display:flex; position:relative; z-index:100;
}
.nb {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; cursor:pointer; padding:5px 1px;
  color:var(--tx-mid); transition:color .2s;
}
.nb.active { color:var(--gold); }
.nb-lbl { font-size:calc(8.5px * var(--scale)); letter-spacing:.5px; text-transform:uppercase; }
.nb-ico svg { width:calc(20px * var(--scale)); height:calc(20px * var(--scale)); display:block; }
.pico svg { width:16px; height:16px; display:block; }

/* Page containers. .page = scrolling page; .stack = fixed header + .fill body;
   .col = the centred reading column (caps line length on desktop). */
.page { height:100%; overflow-y:auto; background:var(--bg); }
.stack { height:100%; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
.fill { flex:1; overflow:hidden; display:flex; flex-direction:column; }
.scroll { flex:1; overflow-y:auto; }
.col { width:100%; max-width:var(--col-w); margin:0 auto; padding:14px var(--gutter) calc(48px + var(--safe-b)); }
.col.flush { padding:0 0 calc(30px + var(--safe-b)); }
.section { margin-top:22px; }

/* Sub-tabs (Practise, Prayers) */
.tabs { display:flex; border-bottom:1px solid var(--bdr); flex-shrink:0; background:var(--surf); }
.tab {
  flex:1; padding:12px 4px; background:none; border:none; border-bottom:2px solid transparent;
  margin-bottom:-1px; color:var(--tx-lo); font-size:var(--fs-body); letter-spacing:.3px; cursor:pointer; transition:color .2s;
}
.tab.on { color:var(--gold); border-bottom-color:var(--gold); }

/* Page header bar (Learn, Settings) */
.phead {
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-shrink:0;
  padding:10px var(--gutter) 8px; border-bottom:1px solid var(--bdr); background:var(--surf);
}
.phead-t { font-family:var(--f-display); font-size:var(--fs-title); letter-spacing:.5px; color:var(--gold); }
.phead-s { font-size:var(--fs-meta); color:var(--tx-lo); margin-top:2px; }

/* ═══════════════════════════════════════════
   TYPE
═══════════════════════════════════════════ */
.label { font-family:var(--f-display); font-size:var(--fs-label); letter-spacing:2px; color:var(--gold-lo); margin-bottom:8px; }
.label.dim { color:var(--tx-lo); }
.label.lg { font-size:var(--fs-meta); }
.stitle { font-family:var(--f-display); font-size:var(--fs-body); letter-spacing:1.5px; color:var(--gold); text-align:center; margin-bottom:18px; }
.prose p { font-family:var(--f-serif); font-size:var(--fs-read); line-height:1.85; color:var(--tx-mid); margin-bottom:14px; }
.prose p.em { font-style:italic; color:var(--tx); }
.fine { font-size:var(--fs-small); line-height:1.7; color:var(--tx-lo); }
.foot { font-size:var(--fs-label); color:var(--tx-ghost); text-align:center; margin-top:10px; line-height:1.6; }
.tib-s { font-size:var(--fs-title); color:var(--red-hi); opacity:.8; line-height:1.7; }
.tib-p { font-family:var(--f-display); font-weight:700; font-size:var(--fs-title); letter-spacing:.5px; color:var(--gold-hi); line-height:1.5; }
.tib-e { font-family:var(--f-serif); font-style:italic; font-size:calc(13.5px * var(--scale)); color:var(--tx-mid); line-height:1.45; }

/* ═══════════════════════════════════════════
   BUTTONS, INPUTS, CHIPS
═══════════════════════════════════════════ */
input[type=number],input[type=date],input[type=text] {
  background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-md);
  padding:12px 14px; width:100%; color:var(--tx);
  font-size:calc(16px * var(--scale)); font-family:var(--f-ui); outline:none;
  -webkit-appearance:none; appearance:none;
}
input:focus { border-color:var(--gold-lo); }
input::placeholder { color:var(--tx-ghost); }
.btn {
  background:var(--btn-bg); color:var(--btn-tx); border:none;
  border-radius:11px; padding:calc(14px * var(--scale)) 18px;
  font-family:var(--f-display); font-size:var(--fs-ui); letter-spacing:1px;
  cursor:pointer; width:100%; transition:opacity .15s;
  box-shadow:0 2px 12px rgba(200,140,10,.2);
}
.btn:active { opacity:.8; }
.btn.narrow { width:80px; flex-shrink:0; }
.btn-o {
  background:transparent; color:var(--tx-mid); border:1px solid var(--bdr);
  border-radius:11px; padding:calc(13px * var(--scale)) 18px;
  font-size:var(--fs-body); cursor:pointer; width:100%; transition:color .2s;
}
.btn-o:active { color:var(--gold); }
.brow { display:flex; gap:10px; } .brow>* { flex:1; }
.inrow { display:flex; gap:8px; margin-bottom:8px; }
hr.rule { border:none; border-top:1px solid var(--bdr); margin:14px 0; }

/* Gold outline link buttons (external links) */
.links { display:flex; flex-wrap:wrap; gap:8px; }
.linkbtn {
  display:inline-block; background:var(--gold-ghost); border:1px solid var(--bdr); border-radius:9px;
  padding:10px 16px; color:var(--gold); font-size:var(--fs-ui); text-decoration:none; cursor:pointer;
}
.linkbtn.sm { padding:7px 12px; font-size:var(--fs-small); border-radius:var(--r-sm); }
.linkbtn.donate { background:linear-gradient(135deg,var(--red),#4a0808); color:#f8f0d8; border:none; }
.linkbtn.hero {
  display:block; text-align:center; padding:14px 20px; border:none; border-radius:11px;
  background:linear-gradient(135deg,var(--gold),var(--gold-lo)); color:var(--bg);
  font-family:var(--f-display); letter-spacing:1px; font-weight:500;
}

/* Selectable option tiles (pace, text size) */
.opt {
  background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-md);
  padding:13px 4px; color:var(--tx); font-size:15px; cursor:pointer; transition:all .2s;
}
.opt.on { background:var(--gold-ghost); border-color:var(--bdr-hi); color:var(--gold); }
.opt-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }

/* Small grey action chips (practice detail) */
.chips { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:11px; }
.chip {
  display:flex; align-items:center; gap:5px; background:var(--inp); border:1px solid var(--bdr);
  border-radius:var(--r-sm); padding:7px 11px; font-size:var(--fs-small); color:var(--tx-mid); cursor:pointer;
}
.chip .ed { font-size:var(--fs-meta); opacity:.55; }

/* ═══════════════════════════════════════════
   CARDS & ROWS
═══════════════════════════════════════════ */
.card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r-lg); padding:14px 16px; }
.card.tint { background:var(--red-lo); }
.card.glow { background:var(--gold-ghost); border-color:var(--bdr-hi); }
.card + .card { margin-top:10px; }

/* Big tappable row: icon · title/subtitle · chevron (Home, More) */
.navrow {
  width:100%; display:flex; align-items:center; gap:13px; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--bdr); border-radius:var(--r-lg);
  padding:13px; margin-bottom:9px;
}
.navrow-ico { color:var(--gold); flex-shrink:0; }
.navrow-ico svg { width:26px; height:26px; display:block; }
.navrow-txt { flex:1; min-width:0; }
.navrow-t { display:block; font-family:var(--f-display); font-size:var(--fs-title); color:var(--tx); }
.navrow-s { display:block; font-size:var(--fs-small); color:var(--tx-mid); margin-top:2px; }
.navrow-chev { color:var(--tx-lo); flex-shrink:0; }
.navrow-chev svg { width:15px; height:15px; display:block; }

/* Plain list row (prayer list, figure index) */
.listrow {
  display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--bdr);
  cursor:pointer; transition:background .15s;
}
.listrow:active { background:var(--gold-ghost); }
.listrow-txt { flex:1; min-width:0; }
.listrow-t { font-family:var(--f-serif); font-size:var(--fs-h); color:var(--tx); line-height:1.2; }
.listrow-s { font-size:var(--fs-meta); color:var(--tx-lo); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.listrow-go { color:var(--tx-lo); font-size:20px; flex-shrink:0; }

/* Picker row inside sheets (log to practice) */
.pickrow {
  width:100%; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  background:var(--inp); border:1px solid var(--bdr); border-radius:11px; padding:12px 14px; margin-bottom:8px;
  font-size:var(--fs-body); color:var(--tx);
}
.pickrow small { font-size:var(--fs-ui); color:var(--tx-lo); }

/* ═══════════════════════════════════════════
   SHEETS, DIALOGS, LIGHTBOX
═══════════════════════════════════════════ */
.veil { position:fixed; inset:0; background:var(--modal); z-index:200; display:flex; align-items:flex-end; }
.veil.center { align-items:center; justify-content:center; padding:18px; }
.sheet {
  background:var(--card); border-top:1px solid var(--bdr); border-radius:22px 22px 0 0;
  width:100%; max-height:90vh; overflow-y:auto; padding:6px 18px calc(24px + var(--safe-b));
  animation:slideUp .28s cubic-bezier(.32,.72,0,1);
}
.dialog {
  background:var(--card); border:1px solid var(--bdr); border-radius:var(--r-2xl);
  padding:22px 18px; width:100%; max-width:360px;
  animation:popIn .22s cubic-bezier(.34,1.56,.64,1);
}
.dialog input { margin-bottom:14px; }
.dlg-note { color:var(--tx-lo); font-size:var(--fs-ui); text-align:center; margin-bottom:14px; }
.handle { width:36px; height:4px; border-radius:2px; background:rgba(128,100,60,.2); margin:10px auto 16px; }
.lightbox { width:100%; max-width:440px; background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--bdr); }
.lightbox-img { position:relative; background:#000; max-height:68vh; overflow:auto; }
.lightbox-img img { width:100%; display:block; }
.lightbox-cap { padding:12px 14px; font-family:var(--f-serif); font-style:italic; font-size:var(--fs-body); color:var(--tx-mid); }
.lightbox-cap .btn { margin-top:10px; }
.xbtn {
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  background:rgba(0,0,0,.5); border:none; color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.fbb {
  position:fixed; bottom:200px; left:50%; transform:translateX(-50%); color:var(--spark);
  font-size:24px; font-weight:300; pointer-events:none; z-index:500;
  animation:rise 1.2s ease-out forwards; text-shadow:0 2px 8px rgba(0,0,0,.5);
}

@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes popIn { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes rise { 0%{opacity:1;transform:translateY(0) translateX(-50%)} 100%{opacity:0;transform:translateY(-60px) translateX(-50%)} }
@keyframes ripple { 0%{transform:scale(.2) translate(-50%,-50%);opacity:.5} 100%{transform:scale(9) translate(-50%,-50%);opacity:0} }

/* ═══════════════════════════════════════════
   HOME
═══════════════════════════════════════════ */
.welcome { margin-bottom:18px; }
.welcome-t { font-family:var(--f-display); font-size:var(--fs-title); color:var(--gold); margin-bottom:7px; }
.welcome-s { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-title); color:var(--tx-mid); line-height:1.7; margin-bottom:12px; }

/* ═══════════════════════════════════════════
   PRACTISE — accordion of practices. Each card sets --acc (its accent).
═══════════════════════════════════════════ */
.acc { background:var(--card); border:1px solid var(--bdr); border-radius:13px; margin-bottom:9px; overflow:hidden; }
.acc-row { display:flex; align-items:center; gap:11px; padding:12px 13px; cursor:pointer; }
.acc-dot { width:12px; height:12px; border-radius:50%; background:var(--acc); flex-shrink:0; }
.acc-mid { flex:1; min-width:0; }
.acc-name { font-family:var(--f-display); font-size:var(--fs-title); color:var(--tx); line-height:1.1; }
.bar { height:5px; border-radius:3px; background:var(--bdr); margin-top:7px; overflow:hidden; }
.bar > i { display:block; height:100%; border-radius:3px; background:var(--acc); }
.acc-num { text-align:right; flex-shrink:0; }
.acc-num b { display:block; font-weight:400; font-size:var(--fs-text); color:var(--tx); }
.acc-num small { display:block; font-size:var(--fs-meta); color:var(--tx-lo); margin-top:1px; }
.acc-add {
  background:color-mix(in srgb,var(--acc) 12%,transparent); border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);
  border-radius:9px; padding:6px 9px; color:var(--acc); font-size:var(--fs-small); cursor:pointer; flex-shrink:0; white-space:nowrap;
}
.acc-tick { color:var(--done); font-size:calc(16px * var(--scale)); flex-shrink:0; }
.acc-chev { color:var(--tx-lo); flex-shrink:0; display:inline-flex; transform:rotate(90deg); transition:transform .2s; }
.acc.open .acc-chev { transform:rotate(-90deg); }

.pd { border-top:1px solid var(--bdr); padding:14px 12px 16px; background:var(--card2); }
.pd-sub { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-body); color:var(--tx-lo); margin-bottom:12px; }
.pd-big { display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; }
.pd-count { font-weight:300; font-size:calc(38px * var(--scale)); color:var(--tx); line-height:1; }
.pd-count.done { color:var(--spark); }
.pd-pct { font-size:var(--fs-small); color:var(--tx-lo); margin-top:4px; }
.pd-add {
  width:62px; height:62px; border-radius:50%; flex-shrink:0; cursor:pointer;
  border:1.5px solid var(--acc); background:color-mix(in srgb,var(--acc) 13%,transparent); color:var(--acc);
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
}
.pd-add small { font-size:11px; line-height:1; }
.pd-add b { font-size:var(--fs-body); font-weight:500; }
.pd-img {
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; margin-bottom:13px;
  background:color-mix(in srgb,var(--acc) 8%,transparent); border:1px solid color-mix(in srgb,var(--acc) 33%,transparent);
  border-radius:11px; padding:11px; color:var(--acc); font-family:var(--f-display); font-size:var(--fs-ui); letter-spacing:.5px;
}
.pd-last { font-size:var(--fs-meta); color:var(--tx-lo); margin-bottom:10px; }
.pd-mantra { text-align:center; padding:6px 0 12px; font-family:var(--f-display); font-weight:700; font-size:var(--fs-meta); letter-spacing:3px; color:var(--red); }
.pd-cv { text-align:right; margin-top:4px; font-size:var(--fs-meta); color:var(--red-hi); }

/* Bead grid (SVG circles, styled here) */
.grid-svg { width:100%; display:block; }
.grid-svg circle { fill:none; stroke:var(--grid); stroke-opacity:.32; stroke-width:.8; }
.grid-svg circle.f { fill:var(--grid); stroke:none; opacity:.88; }
.grid-svg circle.p { fill:var(--grid); stroke:none; opacity:.55; }

/* ═══════════════════════════════════════════
   TAP COUNTER — outer sets --tbg (background) and --ring (accent);
   every tint below is a mix of --ring.
═══════════════════════════════════════════ */
.tap { height:100%; display:flex; flex-direction:column; background:var(--tbg); transition:background .4s; position:relative; overflow:hidden; }
.tap.shown { background:var(--bg); }
.tap-hint { padding:8px 16px 6px; text-align:center; flex-shrink:0; font-size:var(--fs-meta); letter-spacing:.5px; color:color-mix(in srgb,var(--ring) 53%,transparent); }
.tap-pinned {
  padding:4px 16px 8px; text-align:center; flex-shrink:0; font-weight:300; font-size:calc(36px * var(--scale)); line-height:1;
  color:color-mix(in srgb,var(--ring) 87%,transparent); text-shadow:0 2px 12px color-mix(in srgb,var(--ring) 27%,transparent);
}
.tap-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; z-index:2; }
.tap-rings { position:relative; width:140px; height:140px; margin:0 auto; }
.tap-rings i { position:absolute; border-radius:50%; }
.tap-rings i:nth-child(1) { inset:0; border:1.5px solid color-mix(in srgb,var(--ring) 25%,transparent); }
.tap-rings i:nth-child(2) { inset:20px; border:1.5px solid color-mix(in srgb,var(--ring) 44%,transparent); }
.tap-rings i:nth-child(3) {
  inset:42px; border:1.5px solid color-mix(in srgb,var(--ring) 67%,transparent);
  background:radial-gradient(circle,color-mix(in srgb,var(--ring) 33%,transparent),color-mix(in srgb,var(--ring) 13%,transparent));
  box-shadow:0 0 30px color-mix(in srgb,var(--ring) 31%,transparent);
}
.tap-cta { margin-top:22px; font-size:var(--fs-small); letter-spacing:3px; color:color-mix(in srgb,var(--ring) 80%,transparent); text-shadow:0 2px 6px rgba(0,0,0,.6); }
.ripple {
  position:absolute; width:40px; height:40px; border-radius:50%; pointer-events:none;
  background:color-mix(in srgb,var(--ring) 67%,transparent); transform:translate(-50%,-50%); animation:ripple .8s ease-out forwards;
}
.tap-reset { text-align:center; pointer-events:none; padding:0 32px; }
.tap-reset-msg { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-text); color:rgba(255,255,255,.5); line-height:1.5; max-width:260px; margin:0 auto 18px; }
.tap-reset-n { font-size:calc(40px * var(--scale)); color:rgba(255,255,255,.35); margin-bottom:20px; }
.tap-reset-track { background:rgba(255,255,255,.1); border-radius:4px; height:7px; width:240px; max-width:80vw; overflow:hidden; margin-bottom:10px; }
.tap-reset-track i { display:block; height:100%; background:var(--bad); border-radius:4px; transition:width .15s; }
.tap-reset-sec { font-size:var(--fs-small); color:rgba(255,255,255,.92); letter-spacing:1px; }
.tap-total { text-align:center; animation:fadeIn .4s ease-out; pointer-events:none; width:100%; display:flex; flex-direction:column; align-items:center; padding:0 20px; }
.tap-total button { pointer-events:auto; cursor:pointer; }
.tap-log {
  background:var(--gold-ghost); border:1px solid var(--bdr-hi); border-radius:var(--r-lg); padding:13px 28px;
  color:var(--gold); font-family:var(--f-display); font-size:var(--fs-body); letter-spacing:1px; margin-bottom:20px;
}
.tap-total-l { font-family:var(--f-display); color:var(--tx-lo); font-size:var(--fs-small); letter-spacing:3px; margin-bottom:10px; }
.tap-total-n { font-weight:300; font-size:calc(80px * var(--scale)); color:var(--tx); line-height:1; margin-bottom:40px; }
.tap-cont { background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-lg); color:var(--tx-lo); font-size:var(--fs-body); padding:12px 28px; }
.tap-bar {
  display:flex; justify-content:space-between; align-items:center; gap:8px; z-index:3;
  padding:12px 18px calc(12px + var(--safe-b)); background:rgba(0,0,0,.08);
  border-top:1px solid color-mix(in srgb,var(--ring) 9%,transparent);
}
.tap-minus { background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-md); min-width:52px; min-height:52px; color:var(--tx-mid); cursor:pointer; font-size:18px; }
.tap-mid { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
.tap-reveal {
  background:color-mix(in srgb,var(--ring) 7%,transparent); border:1px solid color-mix(in srgb,var(--ring) 19%,transparent);
  border-radius:var(--r-md); padding:13px 20px; color:color-mix(in srgb,var(--ring) 80%,transparent);
  font-family:var(--f-display); font-size:var(--fs-small); letter-spacing:1.5px; cursor:pointer;
}
.tap-pin {
  background:none; border:1px solid transparent; border-radius:var(--r-sm); padding:3px 10px; cursor:pointer;
  color:color-mix(in srgb,var(--ring) 33%,transparent); font-size:var(--fs-label); letter-spacing:.5px;
}
.tap-pin.on { background:color-mix(in srgb,var(--ring) 13%,transparent); border-color:color-mix(in srgb,var(--ring) 38%,transparent); color:color-mix(in srgb,var(--ring) 93%,transparent); }
.tap-rb {
  background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-md); min-width:110px; min-height:52px;
  color:var(--tx-lo); cursor:pointer; font-size:var(--fs-ui); padding:8px 14px; line-height:1.3;
}
.tap-rb.on { color:var(--bad); }
.tap-rb small { display:block; font-size:.75em; opacity:.5; }
.tap-rb.on small { opacity:1; }

/* ═══════════════════════════════════════════
   PRAYERS
═══════════════════════════════════════════ */
.reader-bar { position:sticky; top:0; z-index:10; background:var(--bg); padding:12px 0 10px; border-bottom:1px solid var(--bdr); margin-bottom:16px; }
.reader-bar button { background:none; border:none; color:var(--gold); cursor:pointer; font-size:var(--fs-text); }
.reader-t { font-family:var(--f-display); font-size:var(--fs-h); color:var(--tx); margin-bottom:5px; }
.reader-s { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-text); color:var(--tx-lo); margin-bottom:12px; }
.rule-short { width:50px; height:1px; background:linear-gradient(90deg,var(--gold-lo),transparent); margin-bottom:14px; }
.reader-sec {
  margin:15px 0 9px; padding:7px 12px; background:var(--gold-ghost); border-left:2px solid var(--gold-lo); border-radius:0 8px 8px 0;
  font-family:var(--f-display); font-size:var(--fs-small); letter-spacing:1.5px; color:var(--gold);
}
.verse { margin-bottom:13px; }
.verse .tib-s { margin-bottom:4px; }
.verse .tib-e { margin-top:4px; }
.notice { padding:10px 16px 8px; flex-shrink:0; background:var(--red-lo); border-bottom:1px solid var(--bdr); font-family:var(--f-serif); font-style:italic; font-size:var(--fs-text); color:var(--tx-mid); line-height:1.65; }
.feature { display:block; text-decoration:none; margin-bottom:16px; background:var(--red-lo); border:2px solid var(--gold-lo); border-radius:var(--r-xl); padding:16px; }
.feature-t { font-family:var(--f-serif); font-size:calc(19px * var(--scale)); color:var(--tx); line-height:1.2; margin-bottom:4px; }
.feature-s { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-body); color:var(--tx-mid); margin-bottom:12px; line-height:1.6; }
.sad { border-radius:var(--r-xl); padding:14px 14px 10px; margin-bottom:10px; }
.sad + .sad { margin-top:0; }
.sad-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sad-sym { font-size:calc(20px * var(--scale)); color:var(--gold); flex-shrink:0; }
.sad-t { font-family:var(--f-serif); font-size:var(--fs-read-lg); color:var(--tx); line-height:1.2; }
.sad-s { font-size:var(--fs-meta); color:var(--tx-lo); margin-top:2px; }
.sad .links { gap:6px; }

/* ═══════════════════════════════════════════
   LEARN — refuge tree. Markers/chips/badges set --zc (zone colour).
═══════════════════════════════════════════ */
.mtoggle {
  display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; cursor:pointer;
  background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-md); padding:7px 12px;
  color:var(--tx-lo); font-size:var(--fs-meta); transition:all .2s;
}
.mtoggle.on { background:var(--gold-ghost); border-color:var(--bdr-hi); color:var(--gold); }
.mtoggle .ti { font-size:16px; line-height:1; }
.mtoggle small { font-size:var(--fs-label); opacity:.7; }
.rf-tools { flex-shrink:0; border-bottom:1px solid var(--bdr); background:var(--bg); padding:8px 0 0; }
.rf-tools input { margin:0 var(--gutter); width:calc(100% - 2 * var(--gutter)); padding:10px 14px; }
/* Filter chips double as the colour legend; one horizontally scrolling row */
.fchips { display:flex; gap:5px; overflow-x:auto; padding:8px var(--gutter); scrollbar-width:none; }
.fchips::-webkit-scrollbar { display:none; }
.fchip {
  display:inline-flex; align-items:center; gap:5px; flex-shrink:0; white-space:nowrap; cursor:pointer;
  background:var(--card); border:1px solid var(--bdr); border-radius:var(--r-2xl); padding:5px 10px;
  font-size:var(--fs-meta); color:var(--tx-lo); box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.fchip.on { color:var(--gold); border-color:var(--gold-lo); }
.fchip i { width:9px; height:9px; border-radius:50%; background:var(--zc); border:1.5px solid rgba(255,255,255,.7); }

.thangka {
  /* capped so the whole thangka fits below the Learn header/search (~170px) */
  position:relative; width:100%; max-width:calc((100dvh - 180px) * 1080 / 1359); margin:0 auto;
  aspect-ratio:1080/1359; overflow:hidden; touch-action:pan-y;
}
.stage { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
.stage > img { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:fill; }
.thangka-missing { padding:48px 20px; text-align:center; background:linear-gradient(180deg,#0d1e35,#0a2818 40%,#1a0c08); color:var(--tx-lo); font-family:var(--f-serif); font-style:italic; }
.zbtns { position:absolute; right:8px; bottom:8px; z-index:20; display:flex; flex-direction:column; gap:6px; }
.zbtns button {
  width:30px; height:30px; border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.45); color:#fff; font-size:17px; line-height:1; cursor:pointer; backdrop-filter:blur(4px);
}
.rf-marker {
  position:absolute; transform:translate(-50%,-50%);
  width:24px; height:24px; border-radius:50%; background:var(--zc);
  border:2px solid rgba(255,255,255,.9);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; color:#fff;
  cursor:pointer; z-index:10; transition:all .2s;
  box-shadow:0 2px 6px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.3);
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.rf-marker:hover, .rf-marker:active { transform:translate(-50%,-50%) scale(1.35); box-shadow:0 3px 12px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.3); }
.rf-marker.hidden-marker { display:none; }
.rf-marker.dim { opacity:.25; }
.rf-marker.highlighted { box-shadow:0 0 12px rgba(255,255,255,.6), 0 3px 10px rgba(0,0,0,.7); border-color:#fff; transform:translate(-50%,-50%) scale(1.15); }

.idx-hdr { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:12px var(--gutter); border-top:1px solid var(--bdr); background:var(--surf); }
.idx-hdr .label { margin-bottom:0; }
.idx-hdr small { display:block; font-size:var(--fs-label); color:var(--tx-ghost); margin-top:2px; }
.idx-hdr .chv { color:var(--tx-ghost); font-size:12px; }
.rf-legend-item { padding:9px var(--gutter); }
.rf-legend-item.dim { opacity:.3; }
.rf-legend-item .listrow-t { font-size:var(--fs-read); }
.rf-legend-num {
  width:22px; height:22px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:var(--fs-meta); font-weight:700;
  background:color-mix(in srgb,var(--zc,var(--gold)) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--zc,var(--gold)) 53%,transparent); color:var(--zc,var(--gold));
}
.map-intro { padding:12px var(--gutter) 6px; border-top:1px solid var(--bdr); }
.map-intro .label { margin-bottom:4px; }
.map-intro small { display:block; font-size:var(--fs-label); color:var(--tx-ghost); margin-bottom:8px; }
.refmap { width:100%; margin-bottom:40px; padding:0 var(--gutter); }
.refmap svg { width:100%; display:block; background:#f3ecdc; border-radius:6px; }

/* Figure drawer */
.rf-drawer {
  position:fixed; bottom:0; left:0; right:0; z-index:210;
  background:var(--card); border-top:1px solid var(--bdr); border-radius:22px 22px 0 0;
  max-height:72vh; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom:var(--safe-b);
}
.rf-drawer.open { transform:translateY(0); }
.rf-drawer .handle { cursor:pointer; }
.rf-drawer-scroll { flex:1; overflow-y:auto; padding:0 18px calc(16px + var(--safe-b)); }
.rf-veil { position:fixed; inset:0; z-index:209; background:rgba(0,0,0,0); pointer-events:none; transition:background .3s; }
.rf-veil.open { background:var(--modal); pointer-events:auto; }
.dr-hdr { margin-bottom:16px; }
.dr-id { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.dr-id .rf-legend-num { width:28px; height:28px; font-size:var(--fs-small); }
.dr-name { font-family:var(--f-display); font-size:var(--fs-h); color:var(--tx); line-height:1.1; }
.dr-sub { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-text); color:var(--gold-lo); }
.dr-tib { font-size:var(--fs-title); color:var(--red-hi); opacity:.8; margin-bottom:8px; }
.tags { display:flex; flex-wrap:wrap; gap:5px; }
.tag { background:var(--gold-ghost); border:1px solid var(--bdr); border-radius:var(--r-xs); padding:2px 7px; font-size:var(--fs-label); color:var(--tx-lo); }
.dr-role { font-weight:300; font-size:var(--fs-body); color:var(--tx-mid); margin-bottom:14px; line-height:1.65; }
.dr-bio { font-family:var(--f-serif); font-size:var(--fs-read-lg); color:var(--tx); line-height:1.85; margin-bottom:14px; }
.dr-quote { margin:0 0 16px; padding:12px 14px; border-left:2px solid var(--bdr-hi); background:var(--gold-ghost); border-radius:0 10px 10px 0;
  font-family:var(--f-serif); font-style:italic; font-size:var(--fs-read); color:var(--tx-mid); line-height:1.8; }
.dr-link { display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--bdr); border-radius:var(--r-md); padding:12px 14px; text-decoration:none; color:var(--tx); margin-bottom:14px; }
.dr-link-ico { width:36px; height:36px; border-radius:var(--r-sm); background:var(--gold-ghost); border:1px solid var(--bdr-hi); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
.dr-link b { display:block; font-weight:400; font-size:var(--fs-body); margin-bottom:2px; }
.dr-link small { font-size:var(--fs-meta); color:var(--gold); }

/* ═══════════════════════════════════════════
   CALENDAR & EVENTS
═══════════════════════════════════════════ */
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.cal-arrow { background:var(--inp); border:1px solid var(--bdr); border-radius:var(--r-md); padding:8px 16px; color:var(--gold); cursor:pointer; display:inline-flex; }
.cal-arrow.prev { transform:scaleX(-1); }
.cal-today { font-size:var(--fs-meta); letter-spacing:2px; color:var(--tx-lo); }
.cal-back { background:var(--gold-ghost); border:1px solid var(--bdr-hi); border-radius:var(--r-2xl); padding:6px 15px; color:var(--gold); font-size:var(--fs-small); cursor:pointer; }
.cal-head { text-align:center; padding:6px 0 14px; border-bottom:1px solid var(--bdr); margin-bottom:18px; }
.cal-moon { display:flex; justify-content:center; margin-bottom:12px; }
.cal-date { font-size:var(--fs-meta); color:var(--tx-lo); letter-spacing:2px; margin-bottom:6px; }
.cal-day { font-family:var(--f-display); font-size:var(--fs-h1); color:var(--tx); margin-bottom:4px; }
.cal-tmonth { font-size:var(--fs-small); color:var(--tx-lo); letter-spacing:.5px; margin-bottom:6px; }
.cal-note { font-size:var(--fs-small); color:var(--tx-mid); margin-top:6px; }
.cal-phase { font-family:var(--f-serif); font-style:italic; font-size:var(--fs-read); color:var(--tx-mid); margin-bottom:4px; }
.cal-ausp { font-family:var(--f-display); font-size:var(--fs-text); color:var(--gold); margin-top:10px; letter-spacing:.5px; }

/* ═══════════════════════════════════════════
   SETTINGS — each theme card carries data-theme, so it paints itself
   with that theme's own tokens (no duplicated colour list in JS).
═══════════════════════════════════════════ */
.themes { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:26px; }
.theme-card {
  background:var(--bg); color:var(--tx); border:2px solid rgba(128,100,60,.15); border-radius:13px; padding:13px 12px;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.15); transition:all .2s;
}
.theme-card.on { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 2px 10px rgba(0,0,0,.2); }
.theme-card .tn { display:flex; justify-content:space-between; width:100%; font-weight:700; font-size:13px; }
.theme-card .tn span { color:var(--gold); }
.theme-card .td { font-family:var(--f-serif); font-style:italic; font-size:12px; color:var(--gold); opacity:.9; }
.theme-card .sw { display:flex; gap:4px; margin-top:5px; }
.theme-card .sw i { width:13px; height:13px; border-radius:50%; background:var(--gold); }
.theme-card .sw i:nth-child(2) { background:var(--tx); opacity:.4; }
.theme-card .sw i:nth-child(3) { background:var(--bg); border:1.5px solid color-mix(in srgb,var(--tx) 19%,transparent); }
.sizes { display:flex; gap:9px; margin-bottom:24px; }
.sizes .opt { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:14px 8px; }
.sizes .opt b { font-family:var(--f-display); font-weight:400; line-height:1; color:var(--tx); }
.sizes .opt.on b { font-weight:700; color:var(--gold); }
.sizes .opt small { font-size:10px; color:var(--tx-lo); }

/* ═══════════════════════════════════════════
   DESKTOP — left sidebar nav, centred content column
═══════════════════════════════════════════ */
@media (min-width: 768px) {
  #app { flex-direction:row; }
  #nav {
    order:-1; /* sidebar on the left (it follows #content in the DOM) */
    flex-direction:column; justify-content:flex-start; align-items:stretch;
    width:var(--nav-w); height:100%; flex-shrink:0; padding-bottom:0;
    border-top:none; border-right:1px solid var(--nav-bdr);
  }
  .nb {
    flex:none; width:100%; flex-direction:row; justify-content:flex-start; gap:11px; padding:15px 20px;
    border-left:3px solid transparent; transition:color .2s, background .2s, border-color .2s;
  }
  .nb.active { background:var(--gold-ghost); border-left-color:var(--gold); }
  .nb-lbl { font-size:11px; letter-spacing:.4px; }
  .rf-drawer, .rf-veil { left:var(--nav-w); }
  .rf-drawer { max-width:var(--col-w); margin:0 auto; right:0; }
  /* Sheets become centred dialogs instead of bottom-sliders */
  .veil { align-items:center; justify-content:center; padding:24px; }
  .sheet { border-radius:var(--r-2xl); border:1px solid var(--bdr); max-width:520px; animation:popIn .22s cubic-bezier(.34,1.56,.64,1); }
  .fchips { flex-wrap:wrap; overflow:visible; justify-content:center; }
  ::-webkit-scrollbar { width:5px; }
}
@media (min-width: 1100px) {
  :root { --nav-w:200px; }
  .nb { padding:16px 24px; }
}
</style>

// ═══════════════════════════════════════════════════════════
// THEME & SIZE (persisted, no floating panel)
// ═══════════════════════════════════════════════════════════
function ls(k,d){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  lsSet('esm_theme',t);
}
function setSize(s){
  document.documentElement.style.setProperty('--scale',s);
  lsSet('esm_size',s);
}
(function initA11y(){
  setTheme(ls('esm_theme','light'));
  setSize(ls('esm_size',1));
})();

// LUNAR CALENDAR
// ═══════════════════════════════════════════════════════════
const SYN=29.530588853;
// ── Moon (astronomical) ──
// Elongation of the Moon from the Sun in degrees (0 = new, 180 = full), from
// Meeus "Astronomical Algorithms" ch.48 low-precision terms. Checked against
// all 48 US Naval Observatory phase times for 2026: max error 0.8h (the old
// mean-month method was out by up to 26h). Uses UTC, so it's timezone-safe.
function moonElong(date){
  const R=Math.PI/180,T=(date.getTime()/86400000+2440587.5-2451545)/36525;
  const D=297.8501921+445267.1114034*T,M=357.5291092+35999.0502909*T,Mp=134.9633964+477198.8675055*T;
  const i=180-D-6.289*Math.sin(Mp*R)+2.100*Math.sin(M*R)-1.274*Math.sin((2*D-Mp)*R)
    -0.658*Math.sin(2*D*R)-0.214*Math.sin(2*Mp*R)-0.110*Math.sin(D*R);
  return(((180-i)%360)+360)%360;
}
// "Age" in days since new moon (elongation scaled to the synodic month).
function moonAge(d){return moonElong(d)/360*SYN;}
// ── Tibetan date (Phugpa system) ──
// Svante Janson's "Tibetan Calendar Mathematics", same algorithm and constants
// as github.com/eszthoff/tibetan-date-calculator. Verified 2026-09-30:
// identical day numbers to that library for every day 2000–2060 (21,915 days,
// incl. 838 skipped and 487 doubled days), and to tibetanbuddhistcalendar.org
// for Aug–Nov 2026 incl. the skipped 24th (5 Oct) and doubled 9th (19–20 Oct).
const PH_M0=2015501+4783/5656, PH_M1=167025/5656, PH_M2=(167025/5656)/30;
const PH_S0=743/804, PH_S1=65/804, PH_S2=(65/804)/30;
const PH_A0=475/3528, PH_A1=253/3528, PH_A2=1/28;
const MOON_TAB=[0,5,10,15,19,22,24,25], SUN_TAB=[0,6,10,11];
const phFrac=x=>x-Math.floor(x);
const phMoonInt=i=>{const m=((i%28)+28)%28;return m<=7?MOON_TAB[m]:m<=14?MOON_TAB[14-m]:m<=21?-MOON_TAB[m-14]:-MOON_TAB[28-m];};
const phSunInt=i=>{const m=((i%12)+12)%12;return m<=3?SUN_TAB[m]:m<=6?SUN_TAB[6-m]:m<=9?-SUN_TAB[m-6]:-SUN_TAB[12-m];};
const phMoonTab=i=>{const a=phMoonInt(Math.floor(i)),x=phFrac(i);return x?a+(phMoonInt(Math.floor(i)+1)-a)*x:a;};
const phSunTab=i=>{const a=phSunInt(Math.floor(i)),x=phFrac(i);return x?a+(phSunInt(Math.floor(i)+1)-a)*x:a;};
const phTrueDate=(d,n)=>n*PH_M1+d*PH_M2+PH_M0 + phMoonTab(28*(n*PH_A1+d*PH_A2+PH_A0))/60 - phSunTab(12*(n*PH_S1+d*PH_S2+PH_S0-0.25))/60;
const phJdFromN=n=>{const mc=Math.floor((n-1)/30),d=(n%30)||30;return Math.floor(phTrueDate(d,mc));};
const gregJDN=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;};
// Lunar-day count n (day + 30 × month count) for a civil date: the lunar day
// current at daybreak, i.e. the first one ending on or after this civil day.
// When two lunar days end on the same civil day the second number is skipped;
// when none ends, the number repeats on the next civil day (doubled).
function tibCount(date){
  const jd=gregJDN(date.getFullYear(),date.getMonth()+1,date.getDate());
  const mc=Math.round((jd-PH_M0)/PH_M1);
  let lo=30*(mc-2),hi=30*(mc+3);
  while(phJdFromN(lo)>=jd)lo-=30;
  while(phJdFromN(hi)<jd)hi+=30;
  while(lo+1<hi){const mid=(lo+hi)>>1;phJdFromN(mid)<jd?lo=mid:hi=mid;}
  return hi;
}
function tibDay(date){return(tibCount(date)%30)||30;}
const YEAR_ELEMENTS=['Wood','Fire','Earth','Iron','Water'];
const YEAR_ANIMALS=['Mouse','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Sheep','Monkey','Bird','Dog','Pig'];
// Full Tibetan date: day, month (1–12, maybe a leap month), year + element/animal.
function tibDate(date){
  const n=tibCount(date),mc=Math.floor((n-1)/30);
  const x=Math.ceil((65*mc+123)/67);                       // Janson p.8 (β=123)
  const year=Math.ceil(x/12)-1+806+127;
  return{day:(n%30)||30,month:((x-1)%12)+1,leap:Math.ceil((65*(mc+1)+123)/67)===x,
    year,element:YEAR_ELEMENTS[Math.floor(((year-1)/2)%5)],animal:YEAR_ANIMALS[(year+1)%12]};
}
const ordinal=n=>n+(n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10]||'th');
function moonIllum(age){return(1-Math.cos((age/SYN)*2*Math.PI))/2;}
// Phase name for a whole civil day: a principal phase (new/quarter/full) is
// named only on the day its exact moment falls; otherwise the in-between name.
function moonPhaseOn(date){
  const a=new Date(date);a.setHours(0,0,0,0);
  const b=new Date(a);b.setDate(b.getDate()+1);
  const e0=moonElong(a),e1=moonElong(b)+(moonElong(b)<e0?360:0);
  for(const[deg,name]of[[0,'New Moon'],[90,'First Quarter'],[180,'Full Moon'],[270,'Last Quarter'],[360,'New Moon']])
    if(e0<=deg&&deg<e1)return name;
  const e=moonElong(date);
  return e<90?'Waxing Crescent':e<180?'Waxing Gibbous':e<270?'Waning Gibbous':'Waning Crescent';
}
function moonSVG(age,sz){
  sz=sz||30;const il=moonIllum(age),wax=age<SYN/2,cx=sz/2,cy=sz/2,r=sz/2-1;
  const dark='#1a1828',lit='#f0e8c0';
  // One lit shape over a dark disc: the lit half-disc (right when waxing, left
  // when waning) closed by the terminator ellipse, which bulges into the dark
  // half for a gibbous moon and into the lit half for a crescent.
  let inner='';
  if(il>0.98)inner=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lit}"/>`;
  else if(il>=0.02){
    const rx=r*Math.abs(2*il-1),gib=il>0.5;
    inner=`<path d="M${cx} ${cy-r}A${r} ${r} 0 0 ${wax?1:0} ${cx} ${cy+r}A${rx} ${r} 0 0 ${wax===gib?1:0} ${cx} ${cy-r}Z" fill="${lit}"/>`;
  }
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${dark}"/>${inner}<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(240,220,160,0.2)" stroke-width="0.8"/></svg>`;}

// Special days actually observed on a civil date, applying the usual rules
// (FPMT "Dharma Practice Days explained"): a special day that falls on a
// SKIPPED date is kept on the day before; one on a DOUBLED date is kept on
// the second of the two days. Returns [{td, a, note}].
function observedAusp(date){
  const d=new Date(date);d.setHours(12,0,0,0);
  const nx=new Date(d);nx.setDate(nx.getDate()+1);
  const td=tibDay(d),tn=tibDay(nx),out=[];
  if(tn===td)return out;                      // first of a doubled pair: kept tomorrow
  if(AUSP[td])out.push({td,a:AUSP[td]});
  for(let k=td%30+1;k!==tn;k=k%30+1)          // numbers skipped before tomorrow
    if(AUSP[k])out.push({td:k,a:AUSP[k],note:`Day ${k} is skipped this month, so it is kept today.`});
  return out;
}
// Tibetan day repeats tomorrow (first of a doubled pair)?
function doubledToday(date){const d=new Date(date);d.setHours(12,0,0,0);const nx=new Date(d);nx.setDate(nx.getDate()+1);return tibDay(d)===tibDay(nx);}
function nextAusp(from,n){
  const out=[];const d=new Date(from);d.setHours(12,0,0,0);
  for(let i=0;i<90&&out.length<n;i++){
    d.setDate(d.getDate()+1);
    observedAusp(d).forEach(o=>out.push({date:new Date(d),...o}));}
  return out.slice(0,n);}
function doy(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}

function proj(c,pace,tgt,lastDate){if(pace<=0||c>=tgt)return null;
  const doneToday=lastDate&&new Date(lastDate).toDateString()===new Date().toDateString();
  const d=new Date();d.setDate(d.getDate()+Math.ceil((tgt-c)/pace)-(doneToday?0:1));return d;}

// DOM HELPERS
// ═══════════════════════════════════════════════════════════
// h(tag, attrs, ...kids). attrs: cls → className; sty → inline style (keys
// starting "--" become CSS custom properties — the only inline styles left are
// genuinely dynamic values like a practice's accent or a marker's position);
// on* → listeners; html → innerHTML; anything else → attribute. Falsy kids skip.
function h(tag,at,...kids){
  const el=document.createElement(tag);
  if(at)for(const[k,v]of Object.entries(at)){
    if(v==null||v===false)continue;
    if(k==='cls')el.className=v;
    else if(k==='sty')for(const[p,x]of Object.entries(v)){if(p.startsWith('--'))el.style.setProperty(p,x);else el.style[p]=x;}
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='html')el.innerHTML=v;
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return el;}

  const cS=14,r=cS*.36,NS='http://www.w3.org/2000/svg';
  const el=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e;};
  const svg=el('svg',{viewBox:`0 0 ${COLS*cS} ${rows*cS}`,class:'grid-svg'});
  for(let i=0;i<total;i++){
    const cx=(i%COLS)*cS+cS/2,cy=Math.floor(i/COLS)*cS+cS/2;
    if(i<filled)svg.appendChild(el('circle',{cx,cy,r,class:'f'}));
    else if(i===filled&&partial>0.04){
      // Partly-filled bead: outline plus a bottom-up clipped fill.
      const cid=`p${pr.id}${i}`,cp=el('clipPath',{id:cid});
      cp.appendChild(el('rect',{x:cx-r-1,y:cy+r-partial*2*r-1,width:r*2+2,height:partial*2*r+2}));
      svg.appendChild(el('defs',{})).appendChild(cp);
      svg.appendChild(el('circle',{cx,cy,r}));
      svg.appendChild(el('circle',{cx,cy,r,class:'p','clip-path':`url(#${cid})`}));
    }else svg.appendChild(el('circle',{cx,cy,r}));
  }
  return svg;}

// ═══════════════════════════════════════════════════════════
// TAP COUNTER — background/accent cycle through TC/TR on each tap
// ═══════════════════════════════════════════════════════════
const TC=['#4a1f2d','#1f4a2a','#1f335c','#4a3a12','#3d2461','#144444','#4a3816','#4a2416'];
const TR=['#ff6f91','#5be37a','#6fa8ff','#ffd54a','#b388ff','#4de1e1','#ffbf5a','#ff8a65'];
// Reset-hold timer lives at module scope so it survives re-renders and any
// release (mouse or touch) can clear it. See startR/stopR below.
let tapResetTimer=null, tapResetProg=0;
function renderTap(){
  const{tap,tapShown,tapReset,tapProg,tapPinned}=ST;
  const ci=tap.ci%TC.length;
  const outer=h('div',{cls:'tap'+(tapShown?' shown':''),sty:{'--tbg':TC[ci],'--ring':TR[ci]}});
  const tapping=!tapShown&&!tapReset;
  if(tapping)outer.appendChild(h('p',{cls:'tap-hint'},'Colour change confirms each tap — practise freely'));
  if(tapping&&tapPinned&&tap.count>0)outer.appendChild(h('div',{cls:'tap-pinned'},fmt(tap.count)));

  const ta=h('div',{cls:'tap-area'});
  function doTap(e){if(ST.tapShown||ST.tapReset)return;e.preventDefault();
    const rect=ta.getBoundingClientRect(),src=e.touches?e.touches[0]:e;
    const rip=h('div',{cls:'ripple',sty:{left:`${src.clientX-rect.left}px`,top:`${src.clientY-rect.top}px`}});
    ta.appendChild(rip);setTimeout(()=>rip.remove(),900);
    const nt={count:tap.count+1,ci:(tap.ci+1)%TC.length};lsSet('esm_tap',nt);set({tap:nt});}
  ta.addEventListener('click',doTap);ta.addEventListener('touchstart',doTap,{passive:false});
  if(tapReset){
    ta.appendChild(h('div',{cls:'tap-reset'},
      h('p',{cls:'tap-reset-msg'},'This is about to reset your session total to zero — release to stop'),
      h('p',{cls:'tap-reset-n'},fmt(tap.count)),
      h('div',{cls:'tap-reset-track'},h('i',{id:'tap-reset-bar',sty:{width:`${Math.round(tapProg*100)}%`}})),
      h('p',{id:'tap-reset-sec',cls:'tap-reset-sec'},`${Math.ceil(5-tapProg*5)}s — release to cancel`)));
  }else if(!tapShown){
    ta.appendChild(h('div',{sty:{textAlign:'center',pointerEvents:'none'}},
      h('div',{cls:'tap-rings'},h('i'),h('i'),h('i')),
      h('p',{cls:'tap-cta'},'TAP TO COUNT')));
  }else{
    // Revealed total — LOG TO PRACTICE at the top
    ta.appendChild(h('div',{cls:'tap-total'},
      h('button',{cls:'tap-log',onClick:e=>{e.stopPropagation();set({modal:{type:'figlog',count:tap.count}});}},'LOG TO PRACTICE  ↗'),
      h('p',{cls:'tap-total-l'},'SESSION TOTAL'),
      h('div',{cls:'tap-total-n'},fmt(tap.count)),
      h('button',{cls:'tap-cont',onClick:e=>{e.stopPropagation();set({tapShown:false});}},'Continue tapping')));
  }
  outer.appendChild(ta);

  const bar=h('div',{cls:'tap-bar'},
    h('button',{cls:'tap-minus','aria-label':'Minus one',onClick:()=>{const nt={...tap,count:Math.max(0,tap.count-1)};lsSet('esm_tap',nt);set({tap:nt});}},'−'),
    tapping?h('div',{cls:'tap-mid'},
      h('button',{cls:'tap-reveal',onClick:()=>set({tapShown:true})},'REVEAL TOTAL'),
      h('button',{cls:'tap-pin'+(tapPinned?' on':''),onClick:()=>{const v=!ST.tapPinned;lsSet('esm_tap_pinned',v);set({tapPinned:v});}},tapPinned?'⊙ Total pinned':'○ Keep total on screen'))
    :h('div',{}));
  // Hold 5 seconds to reset
  const rb=h('button',{cls:'tap-rb'+(tapReset?' on':'')},
    tapReset?'Resetting…':'Reset Counter',h('small',{},tapReset?'Release to cancel':'Hold 5 seconds'));
  function startR(){
    if(tapResetTimer)return;            // already holding
    tapResetProg=0;
    set({tapReset:true,tapProg:0});     // render the reset overlay once
    tapResetTimer=setInterval(()=>{
      const bar=document.getElementById('tap-reset-bar');
      // Overlay gone (released, or tab switched mid-hold) — stop and bail.
      if(!bar){clearInterval(tapResetTimer);tapResetTimer=null;return;}
      tapResetProg+=0.04;
      if(tapResetProg>=1){
        clearInterval(tapResetTimer);tapResetTimer=null;
        lsSet('esm_tap',{count:0,ci:0});
        set({tap:{count:0,ci:0},tapShown:false,tapReset:false,tapProg:0});
      }else{
        bar.style.width=Math.round(tapResetProg*100)+'%';
        const sec=document.getElementById('tap-reset-sec');
        if(sec)sec.textContent=Math.ceil(5-tapResetProg*5)+'s — release to cancel';
      }
    },200);
  }
  function stopR(){
    if(tapResetTimer){clearInterval(tapResetTimer);tapResetTimer=null;}
    tapResetProg=0;
    if(ST.tapReset)set({tapReset:false,tapProg:0});
  }
  rb.addEventListener('mousedown',startR);rb.addEventListener('touchstart',e=>{e.preventDefault();startR();},{passive:false});
  rb.addEventListener('mouseup',stopR);rb.addEventListener('mouseleave',stopR);rb.addEventListener('touchend',stopR);
  bar.appendChild(rb);
  outer.appendChild(bar);
  if(ST.modal)outer.appendChild(renderModal());
  return outer;}

// REFUGE TREE — zone colours, marker toggle, bottom drawer
// In-place filtering (no re-render on search, keyboard stays open)
// ═══════════════════════════════════════════════════════════
let rfFilter='';
let rfMarkersVisible=false;

// Zone colour for each category (markers, filter chips, index badges)
const ZONE_COLORS={
  karmapas:'#c09010',lineage:'#b07820',mahasiddhas:'#7040b0',
  teachers:'#1870a8',buddhas:'#3060c0',bodhisattvas:'#1888b8',
  yidams:'#8b1c2a',dakinis:'#b83068',protectors:'#504070','female-masters':'#8840a8',
  offerings:'#9a8050',
};
// Most specific zone wins when a figure has several tags.
const ZONE_ORDER=['karmapas','yidams','dakinis','mahasiddhas','lineage','teachers','buddhas','bodhisattvas','protectors','female-masters','offerings'];
function getZoneColor(tags){
  const z=ZONE_ORDER.find(z=>(tags||[]).includes(z));
  return z?ZONE_COLORS[z]:'#706050';
}
const figMatches=(fig,f)=>!f||fig.name.toLowerCase().includes(f)||(fig.sub||'').toLowerCase().includes(f)||(fig.tags||[]).some(t=>t.includes(f));

function openDrawer(figId){
  const fig=FIGS.find(f=>f.id===figId);
  const scrl=document.getElementById('rf-drawer-scroll');
  scrl.innerHTML='';
  if(!fig)return;
  scrl.append(
    h('div',{cls:'dr-hdr'},
      h('div',{cls:'dr-id'},
        h('div',{cls:'rf-legend-num',sty:{'--zc':getZoneColor(fig.tags)}},String(fig.n)),
        h('div',{},h('p',{cls:'dr-name'},fig.name),h('p',{cls:'dr-sub'},fig.sub||''))),
      fig.tib&&h('p',{cls:'dr-tib'},fig.tib),
      h('div',{cls:'tags'},(fig.tags||[]).map(t=>h('span',{cls:'tag'},t)))),
    ...[fig.role&&[label('ROLE'),h('p',{cls:'dr-role'},fig.role)],
      fig.bio&&[label('BIOGRAPHY'),h('p',{cls:'dr-bio'},fig.bio)],
      fig.teaching&&h('blockquote',{cls:'dr-quote'},'"'+fig.teaching+'"'),
      label('RIGPA WIKI'),
      h('a',{cls:'dr-link',href:`https://www.rigpawiki.org/index.php?search=${encodeURIComponent(fig.name)}`,target:'_blank',rel:'noopener'},
        h('div',{cls:'dr-link-ico'},'📖'),
        h('div',{},h('b',{},`Search: ${fig.name}`),h('small',{},'rigpawiki.org ↗'))),
      fig.wiki&&h('div',{cls:'links'},
        linkBtn('Wikipedia ↗',fig.wiki,'sm'),
        linkBtn('Thangka images ↗',`https://duckduckgo.com/?q=${encodeURIComponent(fig.name+' thangka')}&iax=images&ia=images`,'sm'))
    ].flat().filter(Boolean));
  document.getElementById('rf-drawer').classList.add('open');
  document.getElementById('rf-veil').classList.add('open');}

function closeDrawer(){
  document.getElementById('rf-drawer').classList.remove('open');
  document.getElementById('rf-veil').classList.remove('open');}

function applyRfFilter(val){
  rfFilter=val;
  const f=val.trim().toLowerCase(),searching=!!f;
  // While searching, markers are forced visible and non-matches dimmed.
  document.querySelectorAll('.rf-marker').forEach(el=>{
    const fig=FIGS.find(fg=>fg.id===el.dataset.figid);if(!fig)return;
    const match=figMatches(fig,f);
    el.classList.toggle('hidden-marker',!(rfMarkersVisible||searching));
    el.classList.toggle('dim',searching&&!match);
    el.classList.toggle('highlighted',searching&&match);
  });
  document.querySelectorAll('.rf-legend-item').forEach(el=>{
    const fig=FIGS.find(fg=>fg.id===el.dataset.figid);if(!fig)return;
    el.classList.toggle('dim',!figMatches(fig,f));
  });}

function setRfTag(tag){
  const val=tag==='all'?'':tag,inp=document.getElementById('rf-search-input');
  if(inp)inp.value=val;
  applyRfFilter(val);
  document.querySelectorAll('.fchip').forEach(b=>b.classList.toggle('on',b.dataset.tag===tag));}

// Generated figure-map schematic. Each figure is a tombstone outline + zone-
// coloured number badge + name, positioned from the same FIGS data as the
// markers, so the numbering can never drift. Tap → drawer.
function renderRefMap(){
  const W=1080,H=1400,esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  FIGS.forEach(f=>{
    const cx=f.x/100*W, cy=f.y/100*H, w=66, ht=44, r=8, x=cx-w/2, y=cy-ht/2, col=getZoneColor(f.tags);
    const path=`M${x} ${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+ht} H${x} Z`;
    svg+=`<g data-figid="${f.id}" style="cursor:pointer">`
      +`<path d="${path}" fill="#fffdf7" stroke="${col}" stroke-width="1.5"/>`
      +`<circle cx="${cx}" cy="${y}" r="11" fill="${col}"/>`
      +`<text x="${cx}" y="${y+4.5}" text-anchor="middle" font-family="Lato,sans-serif" font-size="13" font-weight="700" fill="#fff">${f.n}</text>`
      +`<text x="${cx}" y="${cy+9}" text-anchor="middle" font-family="Lato,sans-serif" font-size="9.5" fill="#2a1c10">${esc(f.name)}</text>`
      +`</g>`;
  });
  const wrap=h('div',{cls:'refmap',html:svg+'</svg>'});
  wrap.addEventListener('click',e=>{const g=e.target.closest('[data-figid]');if(g)openDrawer(g.dataset.figid);});
  return wrap;
}

function renderRefuge(container){
  // Header: title + marker show/hide toggle
  const toggleBtn=h('button',{cls:'mtoggle'+(rfMarkersVisible?' on':''),onClick:()=>{
    rfMarkersVisible=!rfMarkersVisible;
    toggleBtn.classList.toggle('on',rfMarkersVisible);
    toggleBtn.querySelector('.ti').textContent=rfMarkersVisible?'◉':'○';
    toggleBtn.querySelector('.tl').textContent=rfMarkersVisible?'Hide':'Show';
    applyRfFilter(rfFilter);
  }},h('span',{cls:'ti'},rfMarkersVisible?'◉':'○'),h('span',{cls:'tl'},rfMarkersVisible?'Hide':'Show'),h('small',{},'markers'));

  // Search + category chips (the chips double as the colour legend)
  const sinp=h('input',{id:'rf-search-input',type:'text',placeholder:'Search by name or category…'});
  sinp.value=rfFilter;
  sinp.addEventListener('input',e=>applyRfFilter(e.target.value));
  const cats=['all',...ZONE_ORDER.filter(z=>FIGS.some(f=>(f.tags||[]).includes(z)))];
  const chips=h('div',{cls:'fchips'},cats.map(t=>h('button',{
    cls:'fchip'+((rfFilter===t||(t==='all'&&!rfFilter))?' on':''),'data-tag':t,
    sty:ZONE_COLORS[t]?{'--zc':ZONE_COLORS[t]}:null,onClick:()=>setRfTag(t)},
    ZONE_COLORS[t]&&h('i'),t==='all'?'All':t)));

  // Thangka with zone-coloured markers. aspect-ratio (in CSS) locks the
  // coordinate space to the image's true proportions (1080×1359) so marker
  // left/top % always map correctly.
  const imgWrap=h('div',{cls:'thangka'});
  const stage=h('div',{cls:'stage'});
  const img=h('img',{src:'refuge-tree.jpg',alt:'Karma Kagyu refuge tree thangka'});
  img.addEventListener('error',()=>{img.remove();stage.appendChild(h('div',{cls:'thangka-missing'},'Refuge tree image missing (refuge-tree.jpg).'));});
  stage.appendChild(img);
  FIGS.forEach(fig=>stage.appendChild(h('div',{
    cls:'rf-marker'+(rfMarkersVisible?'':' hidden-marker'),'data-figid':fig.id,
    sty:{left:`${fig.x}%`,top:`${fig.y}%`,'--zc':getZoneColor(fig.tags)},
    title:`${fig.n}. ${fig.name}`,onClick:()=>openDrawer(fig.id)},String(fig.n))));
  imgWrap.appendChild(stage);

  // ── PINCH / DOUBLE-TAP ZOOM + DRAG-PAN ──────
  // Transforms `stage`; imgWrap stays the clipping viewport.
  {
    let sc=1,tx=0,ty=0;
    const pts=new Map();            // active pointers
    let moved=0,panStart=null,pinch=null,lastTap=0;
    const apply=()=>{stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
      // When zoomed, capture all touch so drags pan; at 1× let the page scroll.
      imgWrap.style.touchAction=sc>1?'none':'pan-y';};
    const clamp=()=>{const W=imgWrap.clientWidth,H=imgWrap.clientHeight;
      sc=Math.max(1,Math.min(5,sc));
      tx=Math.min(0,Math.max(W*(1-sc),tx));
      ty=Math.min(0,Math.max(H*(1-sc),ty));};
    const zoomAt=(px,py,ns)=>{ns=Math.max(1,Math.min(5,ns));
      tx=px-(px-tx)*(ns/sc); ty=py-(py-ty)*(ns/sc); sc=ns; clamp(); apply();};
    const rel=e=>{const r=imgWrap.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
    // Plain wheel scrolls the page; ctrl+wheel (and trackpad pinch, which the
    // browser reports as ctrl+wheel) zooms. Once zoomed, the wheel zooms too.
    imgWrap.addEventListener('wheel',e=>{if(!e.ctrlKey&&sc===1)return;e.preventDefault();const[px,py]=rel(e);zoomAt(px,py,sc*(e.deltaY<0?1.15:0.87));},{passive:false});
    imgWrap.addEventListener('pointerdown',e=>{
      pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
      // Capture only when interacting (zoomed pan, or second finger for pinch)
      // so a plain swipe at 1× still scrolls the page.
      if(sc>1||pts.size===2){try{imgWrap.setPointerCapture(e.pointerId);}catch{}}
      if(pts.size===1){const[px,py]=rel(e);panStart=[px,py,tx,ty];
        const now=Date.now();
        if(now-lastTap<300){zoomAt(px,py,sc>1.5?1:2.6);lastTap=0;}else lastTap=now;
      } else if(pts.size===2){const p=[...pts.values()];
        pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),sc};}
    });
    imgWrap.addEventListener('pointermove',e=>{
      if(!pts.has(e.pointerId))return;
      pts.set(e.pointerId,[e.clientX,e.clientY]);
      if(pts.size>=2&&pinch){const p=[...pts.values()];
        const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
        const r=imgWrap.getBoundingClientRect();
        const mx=(p[0][0]+p[1][0])/2-r.left,my=(p[0][1]+p[1][1])/2-r.top;
        zoomAt(mx,my,pinch.sc*(d/pinch.d));moved=99;
      } else if(pts.size===1&&panStart&&sc>1){
        const[px,py]=rel(e);moved+=Math.abs(px-panStart[0])+Math.abs(py-panStart[1]);
        tx=panStart[2]+(px-panStart[0]);ty=panStart[3]+(py-panStart[1]);clamp();apply();
      }
    });
    const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0)panStart=null;};
    imgWrap.addEventListener('pointerup',up);
    imgWrap.addEventListener('pointercancel',up);
    // Suppress marker taps that were actually drags.
    imgWrap.addEventListener('click',e=>{if(moved>8){e.stopPropagation();e.preventDefault();moved=0;}},true);
    // Zoom buttons (desktop discoverability)
    imgWrap.appendChild(h('div',{cls:'zbtns'},
      h('button',{'aria-label':'Zoom in',onClick:()=>zoomAt(imgWrap.clientWidth/2,imgWrap.clientHeight/2,sc*1.4)},'+'),
      h('button',{'aria-label':'Zoom out',onClick:()=>zoomAt(imgWrap.clientWidth/2,imgWrap.clientHeight/2,sc/1.4)},'−'),
      h('button',{'aria-label':'Reset zoom',onClick:()=>{sc=1;tx=0;ty=0;apply();}},'⤢')));
  }

  // Touch/press to temporarily reveal markers.
  const peek=show=>()=>{if(!rfMarkersVisible&&!rfFilter.trim())
    document.querySelectorAll('.rf-marker').forEach(el=>el.classList.toggle('hidden-marker',!show));};
  imgWrap.addEventListener('touchstart',peek(true),{passive:true});
  imgWrap.addEventListener('touchend',peek(false),{passive:true});
  imgWrap.addEventListener('touchcancel',peek(false),{passive:true});
  imgWrap.addEventListener('mousedown',peek(true));
  imgWrap.addEventListener('mouseup',peek(false));
  imgWrap.addEventListener('mouseleave',peek(false));

  // Figure index — collapsible
  const idxBody=h('div',{sty:{display:'none'}},FIGS.map(fig=>
    h('div',{cls:'listrow rf-legend-item','data-figid':fig.id,onClick:()=>openDrawer(fig.id)},
      h('div',{cls:'rf-legend-num',sty:{'--zc':getZoneColor(fig.tags)}},String(fig.n)),
      h('div',{cls:'listrow-txt'},h('p',{cls:'listrow-t'},fig.name),h('p',{cls:'listrow-s'},fig.sub||'')),
      h('span',{cls:'listrow-go'},'›'))));
  const chv=h('span',{cls:'chv'},'▼');
  const idxHdr=h('div',{cls:'idx-hdr',onClick:()=>{const open=idxBody.style.display==='none';
      idxBody.style.display=open?'block':'none';chv.textContent=open?'▲':'▼';}},
    h('div',{},label('FIGURE INDEX','lg'),h('small',{},`${FIGS.length} figures — tap to read biography`)),chv);

  container.appendChild(h('div',{cls:'stack'},
    pageHead('Karma Kagyu Refuge Field','Tap numbered markers to learn about each figure',toggleBtn),
    h('div',{cls:'rf-tools'},sinp,chips),
    h('div',{cls:'scroll'},
      imgWrap,
      h('div',{cls:'col flush'},
        idxHdr,idxBody,
        // Figure map — generated from FIGS so numbers always match the markers above
        h('div',{cls:'map-intro'},label('FIGURE MAP — numbers match the markers above','lg'),h('small',{},'Tap any figure to read about it.')),
        renderRefMap()))));
  if(rfFilter)setTimeout(()=>applyRfFilter(rfFilter),50);}

function renderCal(){
  ST.calOffset=0;                      // always open on today; nav updates in place
  const wrap=h('div',{});
  fillCal(wrap);
  return wrap;
}
// Rebuilds the calendar for the selected day IN PLACE (no full re-render) so the
// prev/next arrows don't lose scroll position on the Home page.
function fillCal(wrap){
  wrap.innerHTML='';
  const off=ST.calOffset||0;
  const now=new Date(); now.setHours(12,0,0,0); now.setDate(now.getDate()+off);
  const age=moonAge(now),t=tibDate(now),hr=hairRec(t.day),obs=observedAusp(now);
  // First of a doubled pair: the special day itself is kept tomorrow.
  const movedOn=doubledToday(now)&&AUSP[t.day];
  const quote=QUOTES[doy(now)%QUOTES.length];
  const go=d=>{ST.calOffset=d;fillCal(wrap);};
  const arrow=(dir,lbl)=>h('button',{cls:'cal-arrow pico'+(dir<0?' prev':''),'aria-label':lbl,html:ico('chev'),onClick:()=>go(off+dir)});
  wrap.append(
    h('div',{cls:'cal-nav'},arrow(-1,'Previous day'),
      off===0?h('span',{cls:'cal-today'},'TODAY'):h('button',{cls:'cal-back',onClick:()=>go(0)},'↺ Today'),
      arrow(1,'Next day')),
    h('div',{cls:'cal-head'},
      h('div',{cls:'cal-moon',html:moonSVG(age,56)}),
      h('p',{cls:'cal-date'},now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()),
      h('p',{cls:'cal-day'},'Tibetan Day '+t.day),
      h('p',{cls:'cal-tmonth'},`${ordinal(t.month)} month${t.leap?' (leap)':''} · ${t.element} ${t.animal} year`),
      h('p',{cls:'cal-phase'},moonPhaseOn(now)+' — '+Math.round(moonIllum(age)*100)+'% illuminated'),
      obs.map(o=>[h('p',{cls:'cal-ausp'},'✦ '+o.a.name+' ✦'),
        o.note&&h('p',{cls:'cal-note'},o.note),
        h('p',{cls:'cal-ausp-d'},o.a.desc)]),
      movedOn&&h('p',{cls:'cal-note'},`Day ${t.day} falls twice this month — ${movedOn.name} is kept tomorrow.`)),
    h('div',{cls:'card'},label('HAIR CUTTING — Tibetan astrological tradition','dim'),
      h('div',{cls:'hair'},h('b',{cls:hr.rec.toLowerCase()},hr.rec),h('span',{},hr.result))),
    h('div',{cls:'card tint'},label('TEACHING OF THE DAY'),
      h('p',{cls:'quote'},'"'+quote.t+'"'),h('p',{cls:'quote-a'},quote.a)),
    h('div',{cls:'section'},label('NEXT AUSPICIOUS DAYS','dim lg'),
      nextAusp(now,5).map(({date,td:tday,a,note})=>{
        const diff=Math.round((date-now)/86400000),civ=tibDay(date);
        return h('div',{cls:'up'},
          h('div',{html:moonSVG(moonAge(date),30),sty:{display:'flex',flexShrink:'0'}}),
          h('div',{cls:'up-mid'},h('p',{cls:'up-name',sty:{'--acc':a.col}},a.name),
            h('p',{cls:'up-meta'},note?`Day ${tday} skipped — kept on day ${civ}`:`Tib Day ${tday}`,` · Hair: ${hairRec(civ).rec}`)),
          h('div',{cls:'up-when'},h('b',{},diff===0?'Today':diff===1?'Tomorrow':`In ${diff} days`),
            h('p',{cls:'up-date'},date.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))));
      })),
    h('div',{cls:'t-center',sty:{marginTop:'18px'}},linkBtn('Full Tibetan Buddhist Calendar ↗','https://tibetanbuddhistcalendar.org/day')),
    h('p',{cls:'foot'},'Phugpa dates computed with Svante Janson’s algorithm, via the tibetan-date-calculator library.'));
}

      h('p',{cls:'fine'},'Prayer texts are reproduced from the Palpung Changchub Dargyeling Prayer Book for personal practice use only.'))),

        linkBtn('GitHub ↗','https://github.com/jwaga/esmnyndrovnik'),
        linkBtn('Android App ↗','https://play.google.com/store/apps/details?id=pl.eastsidemandala.nyndrovnik'))),

      h('div',{cls:'links'},
        linkBtn('Janson — mathematics ↗','https://www2.math.uu.se/~svantejs/papers/calendars/tibet.pdf'),
        linkBtn('tibetan-date-calculator ↗','https://github.com/eszthoff/tibetan-date-calculator'))),
    h('hr',{cls:'rule'}),
    h('div',{cls:'card tint gratitude'},label('WITH GRATITUDE','lg'),
      h('p',{},'This app was inspired by the dedicated sangha of East Side Mandala, Lublin, Poland. May they swiftly attain enlightenment for the benefit of all beings without exception.'),
      linkBtn('East Side Mandala ↗','https://lublin.buddyzm.pl/')),
    h('p',{cls:'blessing'},'SARWA MANGALAM'));}

// SETTINGS PAGE
// ═══════════════════════════════════════════════════════════
// Only names/descriptions here — each card previews its theme by carrying
// data-theme, so the colours come straight from the CSS theme blocks.
const THEMES=[
  ['light','Light','Warm parchment'],['dark','Dark','Deep amber'],['neuro','Focus','Blue-steel'],
  ['temple','Temple','Saffron & burgundy'],['night','Night','Candlelit indigo'],['earth','Earth','Terracotta & ochre'],
  ['slate','Slate','Cool grey-blue'],['highc','High contrast','Maximum contrast'],['neon','Neon','Futuristic cyan'],
];
const SIZES=[[1,'A','Normal'],[1.18,'A+','Large'],[1.38,'A++','Larger']];
function renderSettings(){
  const curTheme=document.documentElement.getAttribute('data-theme')||'light';
  const curScale=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale'))||1;
  return h('div',{cls:'stack'},
    pageHead('Settings','Appearance and display options'),
    h('div',{cls:'scroll'},col(
      label('THEME'),
      h('div',{cls:'themes'},THEMES.map(([id,name,desc])=>h('button',{cls:'theme-card'+(curTheme===id?' on':''),'data-theme':id,onClick:()=>{setTheme(id);render();}},
        h('span',{cls:'tn'},name,curTheme===id&&h('span',{},'✓')),
        h('span',{cls:'td'},desc),
        h('span',{cls:'sw'},h('i'),h('i'),h('i'))))),
      label('TEXT SIZE'),
      h('div',{cls:'sizes'},SIZES.map(([v,lbl,name])=>h('button',{cls:'opt'+(Math.abs(curScale-v)<0.05?' on':''),onClick:()=>{setSize(v);render();}},
        h('b',{sty:{fontSize:`${Math.round(14*v)}px`}},lbl),h('small',{},name)))))));
}
// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
render();

// Re-render on width change only (desktop resize / device rotation) so the nav
// switches between bar/sidebar and the grid recomputes its cell size. Vertical
// resizes from the mobile URL bar showing/hiding are ignored to avoid churn.
let lastW=window.innerWidth, rzT;
window.addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{if(window.innerWidth!==lastW){lastW=window.innerWidth;render();}},150);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
